<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
  <title> My Official CV </title>
  <link rel="stylesheet" href="cart-box.css">
  <script src="https://kit.fontawesome.com/1ea6370eec.js" crossorigin="anonymous"></script>

         <script src="main.js"></script>

</head>

<body>

  <div class="cart_btn" id="btn_container">
    <div class="static shop">
      <button class="cart_icon">
        <i class="fa-solid fa-cart-shopping"></i>

        
        <span>0</span>
      </button>
    </div>
  </div>

  <h2>add to cart</h2>
  <div class="wrapper">
    <div class="product_card cart_card">
      <div class="card_image">
        <img src="/images/watch 1.png" alt="">
      </div>
      <div class="card_content">
        <h3 class="card_title"> Luxury Watch 1</h3>
        <p class="price card_price">{$3200.99}</p>
        <button class="addto-cartbtn" id="btn_shop">Add to Cart</button>
      </div>


      <div class="product_card cart_card">
        <div class="card_image">
          <img src="/images/watch 1.png" alt="">
        </div>
        <div class="card_content">
          <h3 class="card_title"> Luxury Watch 2</h3>
          <p class="price card_price">{$4700.99}</p>
          <button class="addto-cartbtn" id="btn_shop">Add to Cart</button>
        </div>

        <div class="product_card cart_card">
          <div class="card_image">
            <img src="/images/watch 1.png" alt="">
          </div>
          <div class="card_content">
            <h3 class="card_title"> Luxury Watch 3</h3>
            <p class="price card_price">{$2300.99}</p>
            <button class="addto-cartbtn" id="btn_shop">Add to Cart</button>
          </div>

          <div class="product_card cart_card">
            <div class="card_image">
              <img src="/images/watch 1.png" alt="">
            </div>
            <div class="card_content">
              <h3 class="card_title"> Luxury Watch 4</h3>
              <p class="price card_price">{$1200.99}</p>
              <button class="addto-cartbtn" id="btn_shop">Add to Cart</button>
            </div>

            <div class="product_card cart_card">
              <div class="card_image">
                <img src="/images/watch 1.png" alt="">
              </div>
              <div class="card_content">
                <h3 class="card_title"> Luxury Watch 6</h3>
                <p class="price card_price">{$3500.99}</p>
                <button class="addto-cartbtn" id="btn_shop">Add to Cart</button>
              </div>
            </div>

            <div class="cart_sidebar" id="cart_sidebar">
              <div class="sidebar_close" id="sidebar_close">
                <i class="fa-solid fa-close"></i>
              </div>
              <div class="cart_menu">
                <h3>my cart </h3>
                <div class="cart_items"></div>
              </div>
              <div class="sidebar_footer"></div>
              <div class="total_amount"></div>
              <h5>total</h5>
              <div class="cart_total">$0.00</div>
              <button class="checkout_btn">Checkout</button>
            </div>
            </div>
